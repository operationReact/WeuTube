server:
  port: ${PORT:8080}
spring:
  application:
    name: weutube-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/weutube}
    username: ${DATABASE_USERNAME:weutube}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:http://localhost:9999/not-configured}
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Inject these environment variables at runtime from AWS SSM Parameter Store.
# /weutube/prod/youtube/client-id -> WEUTUBE_YOUTUBE_CLIENT_ID
# /weutube/prod/youtube/client-secret -> WEUTUBE_YOUTUBE_CLIENT_SECRET
# Never place OAuth credentials in source control.
weutube:
  youtube:
    client-id: ${WEUTUBE_YOUTUBE_CLIENT_ID:}
    client-secret: ${WEUTUBE_YOUTUBE_CLIENT_SECRET:}
    redirect-uri: ${WEUTUBE_YOUTUBE_REDIRECT_URI:}
    token-key-base64: ${WEUTUBE_YOUTUBE_TOKEN_KEY_BASE64:}

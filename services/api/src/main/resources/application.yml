server:
  port: ${PORT:8080}
spring:
  application:
    name: weutube-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/weutube}
    username: ${DATABASE_USERNAME:weutube}
    password: ${DATABASE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 260MB
      file-size-threshold: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:http://localhost:9999/not-configured}
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Inject these environment variables at runtime from AWS SSM Parameter Store.
# /weutube/prod/youtube/client-id -> WEUTUBE_YOUTUBE_CLIENT_ID
# /weutube/prod/youtube/client-secret -> WEUTUBE_YOUTUBE_CLIENT_SECRET
# Never place OAuth credentials in source control.
weutube:
  release-sha: ${WEUTUBE_RELEASE_SHA:unversioned}
  cognito:
    region: ${WEUTUBE_COGNITO_REGION:ap-south-1}
    client-id: ${WEUTUBE_COGNITO_CLIENT_ID:}
  youtube:
    ssm-enabled: ${WEUTUBE_YOUTUBE_SSM_ENABLED:false}
    creator-auto-upload-enabled: ${WEUTUBE_YOUTUBE_CREATOR_AUTO_UPLOAD_ENABLED:false}
    ssm-region: ${WEUTUBE_YOUTUBE_SSM_REGION:ap-south-1}
    client-id: ${WEUTUBE_YOUTUBE_CLIENT_ID:}
    client-secret: ${WEUTUBE_YOUTUBE_CLIENT_SECRET:}
    redirect-uri: ${WEUTUBE_YOUTUBE_REDIRECT_URI:}
    token-key-base64: ${WEUTUBE_YOUTUBE_TOKEN_KEY_BASE64:}

name: Backend validation
on:
  push:
    paths:
      - 'services/api/**'
      - 'infra/terraform/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'infra/terraform/**'
jobs:
  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weutube_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: weutube_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weutube_test -d weutube_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - run: mvn -B verify
        working-directory: services/api
        env:
          WEUTUBE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/weutube_test
          WEUTUBE_TEST_POSTGRES_USER: weutube_test
          WEUTUBE_TEST_POSTGRES_PASSWORD: local-ci-only
      - name: Publish tested Spring Boot API JAR
        uses: actions/upload-artifact@v4
        with:
          name: weutube-api-jar-${{ github.run_number }}
          path: services/api/target/api-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform

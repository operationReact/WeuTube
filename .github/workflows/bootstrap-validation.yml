name: AWS bootstrap CloudFormation validation
on:
  push:
    paths:
      - 'infra/bootstrap/**'
      - '.github/workflows/bootstrap-validation.yml'
  pull_request:
    paths:
      - 'infra/bootstrap/**'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bootstrap CloudFormation structure
        run: |
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infra/bootstrap/weutube-terraform-bootstrap.json
      - name: Verify the bootstrap changes only intended resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('infra/bootstrap/weutube-terraform-bootstrap.json').read_text())
          assert set(t['Resources']) == {
            'TerraformStateBucket','StateBucketHttpsPolicy','TerraformBootstrapRolePolicy'
          }
          assert t['Resources']['TerraformStateBucket']['Properties']['BucketName'] == 'weutube-prod-tfstate-098859530205'
          assert t['Parameters']['ExistingGithubRoleName']['Default'] == 'weutube-prod-terraform-github'
          print('Bootstrap template scope validated')
          PY

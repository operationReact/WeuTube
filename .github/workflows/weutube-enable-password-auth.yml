name: WeuTube - apply reviewed Cognito password auth change once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weutube-enable-password-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  apply-reviewed-cognito-change:
    runs-on: ubuntu-latest
    concurrency:
      group: weutube-terraform-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.WEUTUBE_TERRAFORM_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "098859530205"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Prepare exact reviewed production plan
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=weutube-prod-tfstate-098859530205" \
            -backend-config="key=weutube/prod/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform validate
          terraform plan -input=false -out=production-auth.tfplan \
            -var="enable_api=true" \
            -var="api_hosted_zone_id=" \
            -var="github_oidc_provider_arn=arn:aws:iam::098859530205:oidc-provider/token.actions.githubusercontent.com"
          terraform show -json production-auth.tfplan > plan.json
      - name: Refuse any unrelated infrastructure mutations
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          jq -e '
            (.resource_changes | map(select(.change.actions != ["no-op"]))) as $changes
            | ($changes | length) == 1
            and $changes[0].address == "aws_cognito_user_pool_client.weutube[0]"
            and $changes[0].change.actions == ["update"]
            and ($changes[0].change.after.explicit_auth_flows | index("ALLOW_USER_PASSWORD_AUTH")) != null
          ' plan.json >/dev/null || {
            echo "::error::Plan differs from the single pre-reviewed Cognito client change; refusing apply."
            exit 1
          }
          echo "Guard passed: exactly one Cognito app client in-place update"
      - name: Apply guarded plan
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve production-auth.tfplan
      - name: Verify password auth enabled
        working-directory: infra/terraform
        run: |
          pool="$(terraform output -raw cognito_user_pool_id)"
          client="$(terraform output -raw cognito_client_id)"
          aws cognito-idp describe-user-pool-client --region ap-south-1 \
            --user-pool-id "$pool" --client-id "$client" \
            --query 'UserPoolClient.ExplicitAuthFlows' --output json \
            | jq -e 'index("ALLOW_USER_PASSWORD_AUTH") != null'

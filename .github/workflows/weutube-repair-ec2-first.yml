name: WeuTube - repair EC2 Docker and start production containers
# One-time post-infrastructure repair. Copies the already-built, tested
# release and updates only bootstrap scripts; no rebuild or AWS resource recreation.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weutube-repair-ec2-first.yml'
permissions:
  contents: read
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    concurrency:
      group: weutube-api-production
      cancel-in-progress: false
    env:
      SOURCE_RELEASE_SHA: 3f35da2b581a3bbac3b98aacc2acd798b1c7ed80
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate as production Terraform role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.WEUTUBE_TERRAFORM_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Get verified AWS instance and bucket outputs
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "098859530205"
          terraform init -input=false \
            -backend-config="bucket=weutube-prod-tfstate-098859530205" \
            -backend-config="key=weutube/prod/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          echo "INSTANCE_ID=$(terraform output -raw api_instance_id)" >> "$GITHUB_ENV"
          echo "API_EIP=$(terraform output -raw api_eip)" >> "$GITHUB_ENV"
          echo "ARTIFACT_BUCKET=$(terraform output -raw api_artifacts_bucket)" >> "$GITHUB_ENV"
          echo "COGNITO_ISSUER=$(terraform output -raw cognito_issuer_uri)" >> "$GITHUB_ENV"
          echo "DEPLOY_ROLE=$(terraform output -raw github_api_deploy_role_arn)" >> "$GITHUB_ENV"
      - name: Stage immutable rebuilt deployment with the repaired installer
        run: |
          set -euo pipefail
          from="s3://$ARTIFACT_BUCKET/releases/$SOURCE_RELEASE_SHA"
          to="s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA"
          aws s3 cp "$from/" "$to/" --recursive --only-show-errors
          aws s3 cp deploy/deploy-api.sh "$to/deploy-api.sh" --only-show-errors
          aws s3 cp deploy/docker-compose.yml "$to/docker-compose.yml" --only-show-errors
          aws s3 cp deploy/Caddyfile "$to/Caddyfile" --only-show-errors
          aws s3 cp deploy/backup-db.sh "$to/backup-db.sh" --only-show-errors
          aws s3 ls "$to/web-dist.zip" >/dev/null
          aws s3 ls "$to/app.jar" >/dev/null
      - name: Authenticate as narrow API deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ap-south-1
          role-session-name: weutube-ec2-repair
          unset-current-credentials: true
      - name: Repair Docker and bootstrap API plus website containers
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "098859530205"
          base="s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA"
          cmd="mkdir -p /opt/weutube && aws s3 cp '$base/deploy-api.sh' /opt/weutube/deploy-api.sh --region ap-south-1 --only-show-errors && bash /opt/weutube/deploy-api.sh '$ARTIFACT_BUCKET' '$GITHUB_SHA' api.weutube.com '$COGNITO_ISSUER' bootstrap"
          params="$(jq -nc --arg cmd "$cmd" '{commands:[$cmd],executionTimeout:["1800"]}')"
          cmd_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "Repair WeuTube Docker, bootstrap $GITHUB_SHA" \
            --parameters "$params" --query Command.CommandId --output text)"
          echo "SSM command ID: $cmd_id"
          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                echo "SUCCESS: API internal health check passed; public HTTPS depends on Hostinger DNS"
                break ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "::error::EC2 deployment failed: $status"
                aws ssm get-command-invocation --command-id "$cmd_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1 ;;
              *) sleep 10 ;;
            esac
            if [ "$attempt" -eq 180 ]; then echo "::error::SSM deployment timed out"; exit 1; fi
          done
      - name: Provide exact DNS changes for HTTPS activation
        run: |
          {
            echo "## WeuTube production server"
            echo "Elastic IP: $API_EIP"
            echo "Internal application health check passed."
            echo "Hostinger DNS A records: @, www, api -> $API_EIP"
            echo "After DNS resolves: test https://api.weutube.com/actuator/health and https://weutube.com/"
          } | tee -a "$GITHUB_STEP_SUMMARY"

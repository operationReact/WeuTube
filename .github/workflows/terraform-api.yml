name: WeuTube infrastructure - automatic plan, manual apply
on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-api.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: "Plan only (no resources) or apply production infrastructure"
        required: true
        type: choice
        options:
          - plan
          - apply
      state_bucket:
        description: "Existing private S3 bucket for remote Terraform state"
        required: true
        default: weutube-prod-tfstate-098859530205
        type: string
      hosted_zone_id:
        description: "Existing Route53 public zone ID (optional when DNS is external)"
        required: false
        type: string
      github_oidc_provider_arn:
        description: "Existing AWS GitHub OIDC provider ARN (needed to create deploy role)"
        required: false
        default: arn:aws:iam::098859530205:oidc-provider/token.actions.githubusercontent.com
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    concurrency:
      group: weutube-terraform-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate infrastructure inputs
        env:
          ROLE: ${{ secrets.WEUTUBE_TERRAFORM_ROLE_TO_ASSUME }}
          STATE_BUCKET: ${{ inputs.state_bucket || 'weutube-prod-tfstate-098859530205' }}
          HOSTED_ZONE: ${{ inputs.hosted_zone_id || '' }}
          OIDC_PROVIDER: ${{ inputs.github_oidc_provider_arn || 'arn:aws:iam::098859530205:oidc-provider/token.actions.githubusercontent.com' }}
        run: |
          set -euo pipefail
          test -n "$ROLE" || { echo "WEUTUBE_TERRAFORM_ROLE_TO_ASSUME secret is required" >&2; exit 1; }
          [[ "$ROLE" =~ ^arn:aws:iam::098859530205:role/.+ ]] || {
            echo "WEUTUBE_TERRAFORM_ROLE_TO_ASSUME must contain the full IAM Role ARN from AWS account 098859530205 (not the OIDC provider ARN)" >&2
            exit 1
          }
          [ "$STATE_BUCKET" = "weutube-prod-tfstate-098859530205" ] || { echo "Use the production state bucket weutube-prod-tfstate-098859530205" >&2; exit 1; }
          [[ -z "$HOSTED_ZONE" || "$HOSTED_ZONE" =~ ^Z[A-Z0-9]+$ ]] || exit 1
          [[ -z "$OIDC_PROVIDER" || "$OIDC_PROVIDER" =~ ^arn:aws:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com$ ]] || exit 1
      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.WEUTUBE_TERRAFORM_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      - name: Guard production AWS account
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account" != "098859530205" ]; then
            echo "::error::Refusing Terraform deployment outside AWS account 098859530205"
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Initialize encrypted and locked S3 remote state
        working-directory: infra/terraform
        env:
          STATE_BUCKET: ${{ inputs.state_bucket || 'weutube-prod-tfstate-098859530205' }}
        run: |
          terraform fmt -recursive
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=weutube/prod/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform validate
      - name: Generate production plan
        working-directory: infra/terraform
        env:
          HOSTED_ZONE: ${{ inputs.hosted_zone_id || '' }}
          OIDC_PROVIDER: ${{ inputs.github_oidc_provider_arn || 'arn:aws:iam::098859530205:oidc-provider/token.actions.githubusercontent.com' }}
        run: |
          terraform plan -input=false -out=prod.tfplan \
            -var="enable_api=true" \
            -var="api_hosted_zone_id=$HOSTED_ZONE" \
            -var="github_oidc_provider_arn=$OIDC_PROVIDER"
      - name: Apply exact reviewed Terraform plan
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve prod.tfplan
      - name: Show nonsecret connection outputs
        if: inputs.operation == 'apply'
        working-directory: infra/terraform
        run: |
          terraform output api_instance_id
          terraform output api_eip
          terraform output api_artifacts_bucket
          terraform output cognito_issuer_uri
          terraform output github_api_deploy_role_arn

name: WeuTube social public routes smoke
on:
  # Run only AFTER the deployed revision is verified. A push-time smoke
  # check races deployment and reports false failures against the old server.
  workflow_run:
    workflows:
      - WeuTube API and Flutter web - production HTTPS deployment
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-social-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed guest feed and comments authorization
        run: |
          set -euo pipefail
          feed="$(curl -fsS --max-time 15 'https://api.weutube.com/api/public/social/feed?limit=25&includeDemo=false')"
          jq -e '.demoCount == 0 and (.items | type == "array") and (.items | all(.demo == false)) and (.channelSyncStatus | type == "string") and (.connectedChannels | type == "number")' <<< "$feed"
          jq -c '{channelSyncStatus,connectedChannels,importedVideos,realCount}' <<< "$feed"
          if jq -e '.connectedChannels == 0' <<< "$feed" >/dev/null; then
            echo "::warning::Public API is reachable but no authorized YouTube channel has been connected."
          fi
          curl -fsS --max-time 15 'https://api.weutube.com/api/public/social/feed?limit=25&includeDemo=true' | jq -e '.demoCount == 0'
          url='https://api.weutube.com/api/social/videos/00000000-0000-0000-0000-000000000000/comments'
          status="$(curl -sS --max-time 15 -o /tmp/guest-comments.json -w '%{http_code}' "$url")"
          echo "Guest comments HTTP status: $status"
          head -c 500 /tmp/guest-comments.json || true
          echo
          test "$status" = '404'
          post_status="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"text":"unsafe guest test"}' "$url")"
          echo "Anonymous comment mutation HTTP status: $post_status"
          test "$post_status" = '401'

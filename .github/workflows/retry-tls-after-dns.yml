name: WeuTube - retry TLS after DNS propagation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retry-tls-after-dns.yml']
permissions:
  contents: read
  id-token: write
jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all hostnames resolve to the EC2 Elastic IP
        run: |
          set -euo pipefail
          for name in weutube.com www.weutube.com api.weutube.com; do
            for resolver in 1.1.1.1 8.8.8.8; do
              answer="$(dig +short @"$resolver" A "$name" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || true)"
              echo "$resolver / $name: $answer"
              grep -Fxq 13.206.36.135 <<<"$answer" || exit 1
            done
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/weutube-prod-github-api-deploy
          aws-region: ap-south-1
      - name: Restart Caddy with persistent certificate storage and verify
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 098859530205
          cmd='cd /opt/weutube && docker compose restart caddy && docker compose ps caddy'
          params="$(jq -nc --arg cmd "$cmd" '{commands:[$cmd],executionTimeout:["90"]}')"
          id="$(aws ssm send-command --instance-ids i-098ed59f1b1b66446 --document-name AWS-RunShellScript --parameters "$params" --query Command.CommandId --output text)"
          for n in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id i-098ed59f1b1b66446 --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                echo "Caddy restarted; checking external HTTPS."
                break ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$id" --instance-id i-098ed59f1b1b66446 --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1 ;;
              *) sleep 3 ;;
            esac
          done
          for n in $(seq 1 18); do
            if curl --silent --show-error --fail --max-time 10 https://api.weutube.com/actuator/health && \
               curl --silent --show-error --fail --max-time 10 --output /dev/null https://weutube.com/ && \
               curl --silent --show-error --fail --max-time 10 --output /dev/null https://www.weutube.com/; then
              echo "Public TLS and backend/website HTTPS verification passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public HTTPS still failed after Caddy restart; inspect Caddy certificate logs."
          exit 1

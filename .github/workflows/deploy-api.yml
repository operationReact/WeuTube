name: WeuTube API and Flutter web - production HTTPS deployment
# One-click release after Hostinger DNS points @, www, and api at the Terraform EIP.
# Derives all non-secret values from locked Terraform state. No additional repo
# secret beyond the existing WEUTUBE_TERRAFORM_ROLE_TO_ASSUME is necessary.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: weutube-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate existing production Terraform role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.WEUTUBE_TERRAFORM_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Read infrastructure outputs securely
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "098859530205"
          terraform init -input=false \
            -backend-config="bucket=weutube-prod-tfstate-098859530205" \
            -backend-config="key=weutube/prod/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          echo "INSTANCE_ID=$(terraform output -raw api_instance_id)" >> "$GITHUB_ENV"
          echo "API_EIP=$(terraform output -raw api_eip)" >> "$GITHUB_ENV"
          echo "ARTIFACT_BUCKET=$(terraform output -raw api_artifacts_bucket)" >> "$GITHUB_ENV"
          echo "COGNITO_ISSUER=$(terraform output -raw cognito_issuer_uri)" >> "$GITHUB_ENV"
          echo "DEPLOY_ROLE=$(terraform output -raw github_api_deploy_role_arn)" >> "$GITHUB_ENV"
      - name: Verify required encrypted SSM parameters without exposing values
        run: |
          set -euo pipefail
          for suffix in client-id client-secret token-key-base64; do
            aws ssm get-parameter \
              --name "/weutube/prod/youtube/$suffix" --region ap-south-1 \
              --with-decryption --query Parameter.Name --output text >/dev/null
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - name: Test and package Spring Boot API
        working-directory: services/api
        run: mvn -B clean verify
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test and build Flutter website
        working-directory: apps/flutter
        run: |
          flutter create --platforms=web --org com.weutube .
          rm -f test/widget_test.dart analysis_options.yaml
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test test/app_test.dart
          flutter build web --release
      - name: Upload immutable production release
        run: |
          set -euo pipefail
          (cd apps/flutter/build/web && zip -q -r "$GITHUB_WORKSPACE/web-dist.zip" .)
          base="s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA"
          aws s3 cp services/api/target/api-0.1.0.jar "$base/app.jar" --only-show-errors
          aws s3 cp services/api/Dockerfile "$base/Dockerfile" --only-show-errors
          aws s3 cp deploy/docker-compose.yml "$base/docker-compose.yml" --only-show-errors
          aws s3 cp deploy/Caddyfile "$base/Caddyfile" --only-show-errors
          aws s3 cp deploy/deploy-api.sh "$base/deploy-api.sh" --only-show-errors
          aws s3 cp deploy/backup-db.sh "$base/backup-db.sh" --only-show-errors
          aws s3 cp web-dist.zip "$base/web-dist.zip" --only-show-errors
      - name: Assume narrow GitHub deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ap-south-1
          role-session-name: weutube-production-https-deploy
          unset-current-credentials: true
      - name: Deploy through SSM and verify HTTPS end-to-end
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "098859530205"
          base="s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA"
          cmd="mkdir -p /opt/weutube && aws s3 cp '$base/deploy-api.sh' /opt/weutube/deploy-api.sh --region ap-south-1 --only-show-errors && bash /opt/weutube/deploy-api.sh '$ARTIFACT_BUCKET' '$GITHUB_SHA' api.weutube.com '$COGNITO_ISSUER' verify"
          params="$(jq -nc --arg cmd "$cmd" '{commands:[$cmd],executionTimeout:["1800"]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "WeuTube production HTTPS deploy $GITHUB_SHA" \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM command ID: $command_id"
          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                echo "Production HTTPS health check passed inside EC2"
                break ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "::error::Production HTTPS deploy failed: $status"
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1 ;;
              *) sleep 10 ;;
            esac
            if [ "$attempt" -eq 180 ]; then echo "::error::SSM deploy timed out"; exit 1; fi
          done
          curl --fail --silent --show-error --max-time 15 https://api.weutube.com/actuator/health
          curl --fail --silent --show-error --max-time 15 -o /dev/null https://weutube.com/
      - name: Publish verified deployment details
        run: |
          {
            echo "## WeuTube production HTTPS verified"
            echo "Backend: https://api.weutube.com/actuator/health"
            echo "Website: https://weutube.com/"
            echo "Elastic IP: $API_EIP"
            echo "Google OAuth redirect: https://api.weutube.com/api/admin/youtube/callback"
            echo "Note: Flutter account login, uploads and earnings still use prototype UI and must not be presented as live."
          } >> "$GITHUB_STEP_SUMMARY"

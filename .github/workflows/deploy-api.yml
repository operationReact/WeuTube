name: WeuTube API and Flutter web - production HTTPS deployment
# One-click release after Hostinger DNS points @, www, and api at the Terraform EIP.
# Derives all non-secret values from locked Terraform state. No additional repo
# secret beyond the existing WEUTUBE_TERRAFORM_ROLE_TO_ASSUME is necessary.
on:
  workflow_dispatch:
  # Explicit one-time deployment when this workflow itself is updated.
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-api.yml'
      - 'apps/flutter/**'
      - 'services/api/**'
      - 'deploy/**'
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: weutube-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate existing production Terraform role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.WEUTUBE_TERRAFORM_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Read infrastructure outputs securely
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "098859530205"
          terraform init -input=false \
            -backend-config="bucket=weutube-prod-tfstate-098859530205" \
            -backend-config="key=weutube/prod/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          echo "INSTANCE_ID=$(terraform output -raw api_instance_id)" >> "$GITHUB_ENV"
          echo "API_EIP=$(terraform output -raw api_eip)" >> "$GITHUB_ENV"
          echo "ARTIFACT_BUCKET=$(terraform output -raw api_artifacts_bucket)" >> "$GITHUB_ENV"
          echo "COGNITO_ISSUER=$(terraform output -raw cognito_issuer_uri)" >> "$GITHUB_ENV"
          echo "COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id)" >> "$GITHUB_ENV"
          echo "DEPLOY_ROLE=$(terraform output -raw github_api_deploy_role_arn)" >> "$GITHUB_ENV"
      - name: Verify required encrypted SSM parameters without exposing values
        run: |
          set -euo pipefail
          for suffix in client-id client-secret token-key-base64; do
            aws ssm get-parameter \
              --name "/weutube/prod/youtube/$suffix" --region ap-south-1 \
              --with-decryption --query Parameter.Name --output text >/dev/null
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - name: Test and package Spring Boot API
        working-directory: services/api
        run: mvn -B clean verify
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test and build Flutter website
        working-directory: apps/flutter
        run: |
          flutter create --platforms=web,android --org com.weutube .
          python3 tool/configure_google_auth.py
          python3 -m venv /tmp/weutube-brand-venv
          /tmp/weutube-brand-venv/bin/pip install --quiet 'cairosvg>=2.7,<3' 'Pillow>=10,<13'
          /tmp/weutube-brand-venv/bin/python tool/generate_brand_icons.py
          rm -f test/widget_test.dart analysis_options.yaml
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build web --release --dart-define=WEUTUBE_BUILD_SHA="$GITHUB_SHA"
          # Test-only Android package, signed by the ephemeral debug key.
          # Never confuse this with a Play Store production release.
          flutter build apk --debug --dart-define=WEUTUBE_BUILD_SHA="$GITHUB_SHA"
          mkdir -p build/web/downloads
          cp build/app/outputs/flutter-apk/app-debug.apk build/web/downloads/weutube-test.apk
          test -s build/web/downloads/weutube-test.apk
          unzip -tq build/web/downloads/weutube-test.apk >/dev/null
          (cd build/web/downloads && sha256sum weutube-test.apk > weutube-test.apk.sha256)
      - name: Preserve Android test APK as a CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: weutube-android-test-${{ github.run_number }}
          path: apps/flutter/build/web/downloads/weutube-test.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload immutable production release
        run: |
          set -euo pipefail
          (cd apps/flutter/build/web && zip -q -r "$GITHUB_WORKSPACE/web-dist.zip" .)
          base="s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA"
          aws s3 cp services/api/target/api-0.1.0.jar "$base/app.jar" --only-show-errors
          aws s3 cp services/api/Dockerfile "$base/Dockerfile" --only-show-errors
          aws s3 cp deploy/docker-compose.yml "$base/docker-compose.yml" --only-show-errors
          aws s3 cp deploy/Caddyfile "$base/Caddyfile" --only-show-errors
          aws s3 cp deploy/deploy-api.sh "$base/deploy-api.sh" --only-show-errors
          aws s3 cp deploy/backup-db.sh "$base/backup-db.sh" --only-show-errors
          aws s3 cp web-dist.zip "$base/web-dist.zip" --only-show-errors
      - name: Assume narrow GitHub deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ap-south-1
          role-session-name: weutube-production-https-deploy
          unset-current-credentials: true
      - name: Deploy through SSM and verify HTTPS end-to-end
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "098859530205"
          base="s3://$ARTIFACT_BUCKET/releases/$GITHUB_SHA"
          cmd="mkdir -p /opt/weutube && aws s3 cp '$base/deploy-api.sh' /opt/weutube/deploy-api.sh --region ap-south-1 --only-show-errors && bash /opt/weutube/deploy-api.sh '$ARTIFACT_BUCKET' '$GITHUB_SHA' api.weutube.com '$COGNITO_ISSUER' verify '$COGNITO_CLIENT_ID'"
          params="$(jq -nc --arg cmd "$cmd" '{commands:[$cmd],executionTimeout:["1800"]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "WeuTube production HTTPS deploy $GITHUB_SHA" \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM command ID: $command_id"
          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                echo "Production HTTPS health check passed inside EC2"
                break ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "::error::Production HTTPS deploy failed: $status"
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1 ;;
              *) sleep 10 ;;
            esac
            if [ "$attempt" -eq 180 ]; then echo "::error::SSM deploy timed out"; exit 1; fi
          done
          curl --fail --silent --show-error --max-time 15 https://api.weutube.com/actuator/health
          curl --fail --silent --show-error --max-time 15 -o /dev/null https://weutube.com/
          # Stable APK path must be served from the SAME tested web revision.
          curl --fail --silent --show-error --head --max-time 15             https://weutube.com/downloads/weutube-test.apk >/dev/null
          curl --fail --silent --show-error --max-time 15 https://api.weutube.com/api/public/status |
            jq -e --arg sha "$GITHUB_SHA" '.service == "weutube-api" and .revision == $sha' >/dev/null
          # Report actual channel configuration without exposing channel IDs,
          # OAuth tokens, Cognito subjects or claiming real upload success.
          readiness="$(curl --fail --silent --show-error --max-time 15 https://api.weutube.com/api/public/upload-readiness)"
          echo "$readiness" | jq -e --arg sha "$GITHUB_SHA" '.revision == $sha' >/dev/null
          channel_state="$(echo "$readiness" | jq -r '.state')"
          echo "Upload channel diagnostic: $channel_state"
          if [ "$channel_state" != 'CHANNEL_RECORD_PRESENT' ]; then
            echo "::warning::Upload onboarding not ready: $channel_state (Google channel authorization may be required)"
          fi
          # Do not call this successful when private creator routes are
          # mysteriously returning 403 to unauthenticated/invalid JWTs.
          # The expected OAuth resource-server response is 401.
          for path in /api/creator/session /api/creator/dashboard /api/creator/channels; do
            unauth="$(curl --silent --show-error --max-time 12 -o /dev/null -w '%{http_code}' "https://api.weutube.com$path")"
            malformed="$(curl --silent --show-error --max-time 12 -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer invalid-token-smoke-test' "https://api.weutube.com$path")"
            echo "Creator authentication boundary $path: missing=$unauth malformed=$malformed"
            test "$unauth" = 401 && test "$malformed" = 401
          done

          curl --fail --silent --show-error --max-time 20 'https://api.weutube.com/api/public/social/feed?limit=25' \
            | jq -e '.demoContentIncluded == true and .demoCount >= 12 and
                     (.items | any(.creator == "Aanya Rao")) and
                     (.items | any(.creator == "Diya Nair")) and
                     (.items | all(.demo != true or (.avatarUrl != null and .videoUrl != null)))' >/dev/null
          echo "Verified the new twelve-creator demo feed alongside actual published video support"
          # Published-video comments are public; mutations still require Cognito.
          curl --silent --show-error --max-time 12 -o /dev/null -w '%{http_code}' \
            'https://api.weutube.com/api/social/videos/00000000-0000-0000-0000-000000000000/comments' \
            | grep -qx '404'
          # Public reading must not accidentally permit unauthenticated writes.
          post_status="$(curl --silent --show-error --max-time 12 -o /dev/null \
            -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"text":"anonymous write test"}' \
            'https://api.weutube.com/api/social/videos/00000000-0000-0000-0000-000000000000/comments')"
          test "$post_status" = '401'
      - name: Publish verified deployment details
        run: |
          {
            echo "## WeuTube production HTTPS verified"
            echo "Backend: https://api.weutube.com/actuator/health"
            echo "Website: https://weutube.com/"
            echo "Android TEST APK (debug-signed, not Play Store ready): https://weutube.com/downloads/weutube-test.apk"
            echo "SHA-256: https://weutube.com/downloads/weutube-test.apk.sha256"
            echo "Elastic IP: $API_EIP"
            echo "Google OAuth redirect: https://api.weutube.com/api/admin/youtube/callback"
            echo "Immersive social v2, native sharing, guest-readable comments and twelve labelled demo creators deployed; real engagement remains authenticated."
          } >> "$GITHUB_STEP_SUMMARY"

name: WeuTube - diagnose TLS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-tls.yml']
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/weutube-prod-github-api-deploy
          aws-region: ap-south-1
      - name: Inspect Caddy certificate automation, listener, and DNS
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 098859530205
          cmd='cd /opt/weutube && echo "CONTAINERS:" && docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}" && echo "TLS LOGS:" && docker compose logs --tail=110 caddy 2>&1 | grep -Ei "(tls|acme|challenge|certificate|error|issuer|weutube|https|failed|renew)" | tail -85 && echo "HTTP STATUS:" && curl --silent -o /dev/null --write-out "%{http_code}\n" --max-time 7 http://127.0.0.1/actuator/health || true'
          params="$(jq -nc --arg cmd "$cmd" '{commands:[$cmd],executionTimeout:["120"]}')"
          id="$(aws ssm send-command --instance-ids i-098ed59f1b1b66446 --document-name AWS-RunShellScript --parameters "$params" --query Command.CommandId --output text)"
          for n in $(seq 1 24); do
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id i-098ed59f1b1b66446 --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$id" --instance-id i-098ed59f1b1b66446 --query '[StandardOutputContent,StandardErrorContent]' --output text
                test "$status" = Success; exit $? ;;
              *) sleep 5 ;;
            esac
          done
          exit 1

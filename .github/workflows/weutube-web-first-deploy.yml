name: WeuTube - first Flutter web preview deployment
# Deploys only the existing Flutter demo to the new private S3/CloudFront
# distribution. Does not configure DNS or claim backend connectivity.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weutube-web-first-deploy.yml'
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: weutube-terraform-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Assume production Terraform role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.WEUTUBE_TERRAFORM_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      - name: Check AWS account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "098859530205"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Read newly applied infrastructure outputs
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=weutube-prod-tfstate-098859530205" \
            -backend-config="key=weutube/prod/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          WEB_BUCKET="$(terraform output -raw web_bucket)"
          CF_DOMAIN="$(terraform output -raw cloudfront_domain)"
          test -n "$WEB_BUCKET" && test -n "$CF_DOMAIN"
          echo "WEB_BUCKET=$WEB_BUCKET" >> "$GITHUB_ENV"
          echo "CF_DOMAIN=$CF_DOMAIN" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Flutter preview web
        working-directory: apps/flutter
        run: |
          flutter create --platforms=web --org com.weutube .
          rm -f test/widget_test.dart analysis_options.yaml
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test test/app_test.dart
          flutter build web --release
      - name: Upload preview-only static files to private S3
        run: |
          set -euo pipefail
          aws s3 sync apps/flutter/build/web/ "s3://$WEB_BUCKET/" \
            --delete --region ap-south-1 --only-show-errors
          aws s3 cp apps/flutter/build/web/index.html "s3://$WEB_BUCKET/index.html" \
            --cache-control "no-cache,max-age=0" --content-type "text/html; charset=utf-8" \
            --region ap-south-1 --only-show-errors
      - name: Invalidate CloudFront cache and publish preview URL
        run: |
          set -euo pipefail
          CF_ID="$(aws cloudfront list-distributions --query "DistributionList.Items[?DomainName=='$CF_DOMAIN'].Id | [0]" --output text)"
          test -n "$CF_ID" && test "$CF_ID" != "None"
          aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths '/*' > /dev/null
          echo "Preview only: https://$CF_DOMAIN/" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Note: Flutter auth, payments, uploads and dashboard data are still demos." >> "$GITHUB_STEP_SUMMARY"

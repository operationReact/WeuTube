name: Flutter frontend checks
on:
  push:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,web --org com.weutube .
        working-directory: apps/flutter
      - name: Generate approved platform branding
        working-directory: apps/flutter
        run: |
          python3 -m venv /tmp/weutube-brand-venv
          /tmp/weutube-brand-venv/bin/pip install --quiet 'cairosvg>=2.7,<3' 'Pillow>=10,<13'
          /tmp/weutube-brand-venv/bin/python tool/generate_brand_icons.py
          test -f web/favicon.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json
      - run: rm -f test/widget_test.dart analysis_options.yaml
        working-directory: apps/flutter
      - run: flutter pub get
        working-directory: apps/flutter
      - run: flutter analyze --no-fatal-infos
        working-directory: apps/flutter
      - run: flutter test
        working-directory: apps/flutter
      - run: flutter build web --release --dart-define=WEUTUBE_BUILD_SHA=${{ github.sha }}
        working-directory: apps/flutter
      - run: flutter build apk --debug --dart-define=WEUTUBE_BUILD_SHA=${{ github.sha }}
        working-directory: apps/flutter
      - name: Publish Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: weutube-android-debug-${{ github.run_number }}
          path: apps/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Flutter web build
        uses: actions/upload-artifact@v4
        with:
          name: weutube-flutter-web-${{ github.run_number }}
          path: apps/flutter/build/web/
          if-no-files-found: error
          retention-days: 14

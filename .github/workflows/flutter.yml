name: Flutter frontend checks
on:
  push:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android,ios,web --org com.weutube .
        working-directory: apps/flutter
      - run: rm -f test/widget_test.dart analysis_options.yaml
        working-directory: apps/flutter
      - run: flutter pub get
        working-directory: apps/flutter
      - run: flutter analyze --no-fatal-infos
        working-directory: apps/flutter
      - run: flutter test
        working-directory: apps/flutter
      - run: flutter build web --release
        working-directory: apps/flutter
      - run: flutter build apk --debug
        working-directory: apps/flutter
      - name: Publish Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: weutube-android-debug-${{ github.run_number }}
          path: apps/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Flutter web build
        uses: actions/upload-artifact@v4
        with:
          name: weutube-flutter-web-${{ github.run_number }}
          path: apps/flutter/build/web/
          if-no-files-found: error
          retention-days: 14

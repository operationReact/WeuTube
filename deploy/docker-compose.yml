services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    env_file:
      - ./secrets/db.env
    environment:
      POSTGRES_DB: weutube
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d weutube"]
      interval: 10s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: weutube-api:local
    restart: unless-stopped
    env_file:
      - ./secrets/app.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
      - public
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEUTUBE_API_DOMAIN: ${WEUTUBE_API_DOMAIN:?Set API hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
    networks:
      - public
volumes:
  pgdata:
  caddydata:
  caddyconfig:
networks:
  private:
    internal: true
  public: {}

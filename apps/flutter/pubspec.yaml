name: weutube
description: WeuTube creator platform frontend
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  http_parser: ^4.1.1
  file_picker: ^10.3.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.17
  flutter_web_auth_2: ^5.1.0
  crypto: ^3.0.6
  video_player: ^2.9.5
  youtube_player_iframe: 6.0.2
  share_plus: ^11.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/brand/weutube-logo.svg
    - assets/brand/weutube-icon.svg
    - assets/brand/google-g.svg
